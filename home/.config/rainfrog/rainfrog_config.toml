[settings]
mouse_mode = true
data_compact_columns = true
data_row_spacer = false
autocomplete_enabled = true
autocomplete_debounce_ms = 100
autocomplete_trigger_len = 1
autopairs_enabled = true

[db]
# you can add frequently used database connections here. example:
# dev-postgres = { host = "localhost", driver = "postgres", port = 5499, database = "rainfrog", username = "root" }
# enable_cleartext_plugin is opt-in and only applies to mysql connections
# dev-mysql = { host = "localhost", driver = "mysql", port = 3306, database = "mydb", username = "user", enable_cleartext_plugin = true }
ai_project = { driver = "postgres", username = "postgres", host = "localhost", port = 5432, database = "ai_project" }

[keybindings.Menu]
"<Ctrl-q>" = "Quit"
"q" = "AbortQuery"
"1" = "FocusMenu"
"2" = "FocusEditor"
"3" = "FocusData"
"4" = "FocusHistory"
"5" = "FocusFavorites"
"<Tab>" = "CycleFocusForwards"
"<Backtab>" = "CycleFocusBackwards"
"<Ctrl-minus>" = "DecreaseSectionSize"
"<Ctrl-=>" = "IncreaseSectionSize"

[keybindings.Editor]
"<Ctrl-space>" = "TriggerCompletion"
"<Alt-q>" = "AbortQuery"
"<Alt-e>" = "RequestExternalEditor"
"<F6>" = "RequestExternalEditor"
"<F5>" = "SubmitEditorQuery"
"<F7>" = "SubmitEditorQueryBypassParser"
"1" = "FocusMenu"
"2" = "FocusEditor"
"3" = "FocusData"
