# https://github.com/sxyazi/yazi/blob/shipped/yazi-config/preset/keymap-default.toml

#:schema https://yazi-rs.github.io/schemas/keymap.json

[mgr]

prepend_keymap = [
	{ on = "<C-\\>", for = "unix", run = 'shell "$SHELL" --block', desc = "Open $SHELL here" },
	{ on = "<C-\\>", for = "windows", run = 'shell "powershell.exe" --block', desc = "Open PowerShell here" },

	{ on = "<C-n>", for = "unix", run ="shell -- dragon-drop --icon-only --and-exit -on-top %h", desc = "Extract File for Drag&Drop" },

	{ on = "<C-q>", run = "quit", desc = "Quit" },
	{ on = "<C-Q>", run = "quit --no-cwd-file", desc = "Quit without outputting cwd-file" },

	{ on = "<C-t>", run = "tab_create --current", desc = "Create a new tab with CWD" },
	{ on = "<C-w>", run = "close", desc = "Close the current tab, or quit if it's last" },

	{ on = "<C-[>", run = "tab_switch -1 --relative", desc = "Switch to previous tab" },
	{ on = "<C-]>", run = "tab_switch 1 --relative", desc = "Switch to next tab" },
	{ on = "<C-9>", run = "tab_swap -1", desc = "Swap current tab with previous tab" },
	{ on = "<C-0>", run = "tab_swap 1", desc = "Swap current tab with next tab" },
	{ on = "[", run = "noop" },
	{ on = "]", run = "noop" },
	{ on = "{", run = "noop" },
	{ on = "}", run = "noop" },

	{ on = "<C-1>", run = "tab_switch 0", desc = "Switch to tab 1" },
	{ on = "<C-2>", run = "tab_switch 1", desc = "Switch to tab 2" },
	{ on = "<C-3>", run = "tab_switch 2", desc = "Switch to tab 3" },
	{ on = "<C-4>", run = "tab_switch 3", desc = "Switch to tab 4" },
	{ on = "<C-5>", run = "tab_switch 4", desc = "Switch to tab 5" },
	{ on = "<C-6>", run = "tab_switch 5", desc = "Switch to tab 6" },
	{ on = "<C-7>", run = "tab_switch 6", desc = "Switch to tab 7" },
	{ on = "<C-8>", run = "tab_switch 7", desc = "Switch to tab 8" },
	{ on = "1", run = "noop" },
	{ on = "2", run = "noop" },
	{ on = "3", run = "noop" },
	{ on = "4", run = "noop" },
	{ on = "5", run = "noop" },
	{ on = "6", run = "noop" },
	{ on = "7", run = "noop" },
	{ on = "8", run = "noop" },
	{ on = "9", run = "noop" },
	{ on = "0", run = "noop" },


	{ on = [ "f", "f" ], run = "search --via=fd", desc = "Search files by name via fd" },
	{ on = [ "f", "g" ], run = "search --via=rg", desc = "Search files by content via ripgrep" },
	{ on = [ "f", "z" ], run = "plugin fzf", desc = "Jump to a file/directory via fzf" },
	{ on = [ "f", "r" ], run = "plugin zoxide", desc = "Jump to a directory via zoxide" },
	{ on = "s", run = "noop" },
	{ on = "S", run = "noop" },
	{ on = "z", run = "noop" },
	{ on = "Z", run = "noop" },

	{ on = "<Space>", run = [ "toggle" ], desc = "Toggle the current selection state" },

	{ on = "<C-u>", run = "seek -5", desc = "Seek up 5 units in the preview" },
	{ on = "<C-d>", run = "seek 5", desc = "Seek down 5 units in the preview" },

	{ on = "H", run = "hidden toggle", desc = "Toggle the visibility of hidden files" },

	{ on = "t", run = "tasks:show", desc = "Show task manager" },
	{ on = "w", run = "noop" },

	{ on = "<Tab>", run = "spot", desc = "Spot hovered file" },

	{ on = [ "i", "s" ], run = "linemode size", desc = "Info: size" },
	{ on = [ "i", "m" ], run = "linemode mtime", desc = "Info: modified time" },
	{ on = [ "i", "p" ], run = "linemode permissions", desc = "Info: permissions" },
	{ on = [ "i", "o" ], run = "linemode owner", desc = "Info: owner" },
	{ on = [ "i", "b" ], run = "linemode btime", desc = "Info: birth time" },
	{ on = [ "i", "n" ], run = "linemode none", desc = "Info: none" },
	{ on = [ "m", "s" ], run = "noop" },
	{ on = [ "m", "m" ], run = "noop" },
	{ on = [ "m", "p" ], run = "noop" },
	{ on = [ "m", "o" ], run = "noop" },
	{ on = [ "m", "b" ], run = "noop" },
	{ on = [ "m", "n" ], run = "noop" },

	{ on = [ "s", "m" ], run = [ "sort --reverse=no mtime", "linemode mtime" ], desc = "Sort: modified time" },
	{ on = [ "s", "M" ], run = [ "sort mtime --reverse", "linemode mtime" ], desc = "Sort: modified time (reverse)" },
	{ on = [ "s", "b" ], run = [ "sort btime --reverse=no", "linemode btime" ], desc = "Sort: birth time" },
	{ on = [ "s", "B" ], run = [ "sort btime --reverse", "linemode btime" ], desc = "Sort: birth time (reverse)" },
	{ on = [ "s", "e" ], run = "sort extension --reverse=no", desc = "Sort: extension" },
	{ on = [ "s", "E" ], run = "sort extension --reverse", desc = "Sort: extension (reverse)" },
	{ on = [ "s", "a" ], run = "sort alphabetical --reverse=no", desc = "Sort: alphabetically" },
	{ on = [ "s", "A" ], run = "sort alphabetical --reverse", desc = "Sort: alphabetically (reverse)" },
	{ on = [ "s", "n" ], run = "sort natural --reverse=no", desc = "Sort: naturally" },
	{ on = [ "s", "N" ], run = "sort natural --reverse", desc = "Sort: naturally (reverse)" },
	{ on = [ "s", "s" ], run = [ "sort size --reverse=no", "linemode size" ], desc = "Sort: size" },
	{ on = [ "s", "S" ], run = [ "sort size --reverse", "linemode size" ], desc = "Sort: size (reverse)" },
	{ on = [ "s", "r" ], run = "sort random --reverse=no", desc = "Sort: randomly" },
	{ on = [ ",", "m" ], run = "noop" },
	{ on = [ ",", "M" ], run = "noop" },
	{ on = [ ",", "b" ], run = "noop" },
	{ on = [ ",", "B" ], run = "noop" },
	{ on = [ ",", "e" ], run = "noop" },
	{ on = [ ",", "E" ], run = "noop" },
	{ on = [ ",", "a" ], run = "noop" },
	{ on = [ ",", "A" ], run = "noop" },
	{ on = [ ",", "n" ], run = "noop" },
	{ on = [ ",", "N" ], run = "noop" },
	{ on = [ ",", "s" ], run = "noop" },
	{ on = [ ",", "S" ], run = "noop" },
	{ on = [ ",", "r" ], run = "noop" },

	{ on = [ "L", "s" ], run = "link", desc = "Link: symlink the abs path of yanked files" },
	{ on = [ "L", "S" ], run = "link --relative", desc = "Link: symlink the rel path of yanked files" },
	{ on = [ "L", "h" ], run = "hardlink", desc = "Link: hardlink" },
	{ on = "-", run = "noop" },
	{ on = "_", run = "noop" },
	{ on = "<C-->", run = "noop" },

	{ on = [ "c", "d" ], run = "cd --interactive", desc = "Change Directory" },

	{ on = [ "g", "s" ], run = "follow", desc = "Go to hovered symlink" },
	{ on = [ "g", "f" ], run = "noop" },

	{ on = [ "A", "a" ], run = "plugin compress", desc = "Archive selected files" },
	{ on = [ "A", "p" ], run = "plugin compress -p", desc = "Archive selected files (password)" },
	{ on = [ "A", "h" ], run = "plugin compress -ph", desc = "Archive selected files (password+header)" },
	{ on = [ "A", "l" ], run = "plugin compress -l", desc = "Archive selected files (compression level)" },
	{ on = [ "A", "u" ], run = "plugin compress -phl", desc = "Archive selected files (password+header+level)" },

	{ on = [ "A", "o" ], run = "plugin ouch 7z", desc = "Archive with ouch" },

	{ on = [ "u" ], run = "plugin restore", desc = "Restore last deleted files/folders" },

	{ on = [ "T", "T" ], run = "plugin recycle-bin open", desc = "Open Trash" },
	{ on = [ "T", "e" ], run = "plugin recycle-bin empty", desc = "Empty Trash" },
	{ on = [ "T", "d" ], run = "plugin recycle-bin delete", desc = "Delete permanently from Trash" },
	{ on = [ "T", "D" ], run = "plugin recycle-bin emptyDays", desc = "Empty Trash by days deleted" },
	{ on = [ "T", "r" ], run = "plugin recycle-bin restore", desc = "Restore from Trash" },

	{ on = [ "M", "M" ], run = "plugin mount", desc = "Mount UI" },

	{ on = [ "m" ], run = "plugin yamb -- save", desc = "Save current position as a bookmark" },
	{ on = [ "`" ], run = "plugin yamb -- jump_by_key", desc = "Jump to a bookmark" },
	{ on = [ "<C-`>", "f" ], run = "plugin yamb -- jump_by_fzf", desc = "Jump to a bookmark by fzf" },
	{ on = [ "<C-`>", "d" ], run = "plugin yamb -- delete_by_key", desc = "Delete a bookmark" },
	{ on = [ "<C-`>", "D" ], run = "plugin yamb -- delete_by_fzf", desc = "Delete a bookmark by fzf" },
	{ on = [ "<C-`>", "r" ], run = "plugin yamb -- rename_by_key", desc = "Rename a bookmark" },
	{ on = [ "<C-`>", "R" ], run = "plugin yamb -- rename_by_fzf", desc = "Rename a bookmark by fzf" },

	# TODO: custom name with "my-" because symlink. Rewrite when issue disappear
	# https://github.com/sxyazi/yazi/discussions/4280
	{ on  = "<C-c>", run = [ "yank", 'plugin my-clipboard -- --action=copy' ], desc = "Yank selected files (copy)" },
	{ on  = "<C-x>", run = [ "yank --cut", 'plugin my-clipboard -- --action=copy' ], desc = "Yank selected files (cut)" },
	{ on  = "<C-v>", run = [ 'plugin my-clipboard -- --action=paste' ], desc = "Paste yanked system clipboard files" },
]

[tasks]
prepend_keymap = [
	{ on = "<C-q>", run = "close", desc = "Close task manager" },
]

[spot]
prepend_keymap = [
	{ on = "<C-q>", run = "close", desc = "Close the spot" },
]

[pick]
prepend_keymap = [
	{ on = "<C-q>", run = "close", desc = "Cancel pick" },
]

[input]
prepend_keymap = [
	{ on = "<C-q>", run = "close", desc = "Cancel input" },
]

[confirm]
prepend_keymap = [
	{ on = "<C-q>", run = "close", desc = "Cancel the confirm" },
]

[cmp]
prepend_keymap = [
	{ on = "<C-q>", run = "close", desc = "Cancel completion" },
	{ on = "<C-k>", run = "arrow prev", desc = "Previous item" },
	{ on = "<C-j>", run = "arrow next", desc = "Next item" },
]

[help]
prepend_keymap = [
	{ on = "<C-q>", run = "close", desc = "Hide the help" },
	{ on = "//", run = "filter", desc = "Filter help items" },
]
